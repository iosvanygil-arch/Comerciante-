name: Pruebas y compilación web
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas contables
        run: npm test
      - name: Compilar aplicación web
        run: npm run build
      - name: Verificar archivos generados
        run: test -s dist/index.html
