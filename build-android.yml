
name: Construir APK Android

on:
  push:
    paths:
      - 'COMERCIANTE_ANDROID_GITHUB.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Pruebas y APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extraer proyecto
        run: unzip -q COMERCIANTE_ANDROID_GITHUB.zip -d source

      - name: Instalar dependencias y ejecutar pruebas
        working-directory: source/COMERCIANTE
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Crear proyecto Android
        working-directory: source/COMERCIANTE
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: source/COMERCIANTE/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: COMERCIANTE-Android-debug
          path: source/COMERCIANTE/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
